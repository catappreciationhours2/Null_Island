<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />

		<!-- PWA -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="theme-color" content="#4a7c59" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Null Island" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />

		%sveltekit.head%
		<!-- Hide until theme is applied — prevents SSR/hydration content flash -->
		<style>html:not([data-theme]) { visibility: hidden; }</style>
		<!-- Inline theme bootstrap: runs synchronously before first paint -->
		<script>
			(function () {
				try {
					var t = localStorage.getItem('hw-theme') || 'cottage';
					document.documentElement.dataset.theme = t;
				} catch (e) {
					// If localStorage is unavailable, set the default so visibility is restored
					document.documentElement.dataset.theme = 'cottage';
				}
			})();
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
